---
name: test
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        private:
          - 'false'
          - 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          git config --global user.name bot
          git config --global user.email bot@example.com
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - run: ./scripts/install
      - run: ./scripts/test
        env:
          PRIVATE: ${{ matrix.private }}
